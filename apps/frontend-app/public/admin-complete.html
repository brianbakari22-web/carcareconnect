<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Care Connect - Complete Admin Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f3f4f6;
        }
        .admin-container { display: flex; min-height: 100vh; }
        .sidebar {
            width: 280px;
            background: white;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            box-shadow: 2px 0 8px rgba(0,0,0,0.05);
            z-index: 100;
        }
        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: bold; }
        .logo span { font-size: 28px; }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 24px;
            margin: 4px 8px;
            border-radius: 10px;
            cursor: pointer;
            color: #6b7280;
        }
        .menu-item:hover, .menu-item.active { background: #f3f4f6; color: #8b5cf6; }
        .main-content { flex: 1; margin-left: 280px; }
        .top-header {
            background: white;
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e5e7eb;
        }
        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
        }
        .content-area { padding: 24px 30px; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: white;
            padding: 16px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .stat-value { font-size: 24px; font-weight: bold; color: #8b5cf6; }
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card-title { font-size: 16px; font-weight: bold; margin-bottom: 15px; }
        .driver-list { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
        .driver-item {
            background: #f3f4f6;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .online-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
        }
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e5e7eb; }
        th { background: #f9fafb; }
        .btn-sm {
            padding: 4px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }
        .btn-danger { background: #ef4444; color: white; }
        .btn-success { background: #10b981; color: white; }
        .btn-purple { background: #8b5cf6; color: white; }
        .filters { display: flex; gap: 10px; margin-bottom: 20px; }
        .filter-select, .filter-input {
            padding: 6px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
        }
        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            display: inline-block;
        }
        .badge-pending { background: #fef3c7; color: #92400e; }
        .badge-confirmed { background: #d1fae5; color: #065f46; }
        .badge-completed { background: #d1fae5; color: #065f46; }
        .empty-state { text-align: center; padding: 40px; color: #6b7280; }
        .loading { text-align: center; padding: 60px; }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="logo"><span>👑</span> Car Care</div>
            </div>
            <div class="menu-item active" data-tab="dashboard">📊 Dashboard</div>
            <div class="menu-item" data-tab="users">👥 Users</div>
            <div class="menu-item" data-tab="providers">🔧 Providers</div>
            <div class="menu-item" data-tab="drivers">🚗 Drivers</div>
            <div class="menu-item" data-tab="bookings">📅 Bookings</div>
            <div class="menu-item" data-tab="services">🛠️ Services</div>
            <div class="menu-item" data-tab="revenue">💰 Revenue</div>
            <div class="menu-item" data-tab="payouts">💸 Payouts</div>
            <div class="menu-item" data-tab="refunds">🔄 Refunds</div>
            <div class="menu-item" data-tab="reviews">⭐ Reviews</div>
            <div class="menu-item" data-tab="promos">🎟️ Promo Codes</div>
            <div class="menu-item" data-tab="loyalty">💎 Loyalty</div>
        </div>
        <div class="main-content">
            <div class="top-header">
                <h1 id="pageTitle">Dashboard</h1>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
            <div class="content-area" id="content"><div class="loading">Loading...</div></div>
        </div>
    </div>

    <script>
        let token = localStorage.getItem('adminToken');
        let currentTab = 'dashboard';
        let allUsers = [], allBookings = [], allServices = [], allRefunds = [], allReviews = [], allPromoCodes = [], allLoyalty = [];
        let onlineDrivers = [];
        let filterRole = 'all', filterStatus = 'all', searchTerm = '';
        let stats = { users: { total: 0, customers: 0, providers: 0, drivers: 0 }, bookings: { total: 0, completed: 0 }, payments: { totalRevenue: 0 } };

        if (!token) { window.location.href = '/admin-login.html'; }

        async function fetchAll() {
            await Promise.all([
                fetch('http://localhost:5000/api/admin/stats', { headers: { 'Authorization': `Bearer ${token}` } }).then(r=>r.json()).then(d=>{if(d.success)stats=d.stats;}).catch(e=>console.log(e)),
                fetch('http://localhost:5000/api/admin/users', { headers: { 'Authorization': `Bearer ${token}` } }).then(r=>r.json()).then(d=>{if(d.success)allUsers=d.users;}).catch(e=>console.log(e)),
                fetch('http://localhost:5000/api/admin/bookings', { headers: { 'Authorization': `Bearer ${token}` } }).then(r=>r.json()).then(d=>{if(d.success)allBookings=d.bookings;}).catch(e=>console.log(e)),
                fetch('http://localhost:5000/api/admin/services', { headers: { 'Authorization': `Bearer ${token}` } }).then(r=>r.json()).then(d=>{if(d.success)allServices=d.services;}).catch(e=>console.log(e)),
                fetch('http://localhost:5000/api/refunds/all', { headers: { 'Authorization': `Bearer ${token}` } }).then(r=>r.json()).then(d=>{if(d.success)allRefunds=d.refunds;}).catch(e=>console.log(e)),
                fetch('http://localhost:5000/api/reviews/all', { headers: { 'Authorization': `Bearer ${token}` } }).then(r=>r.json()).then(d=>{if(d.success)allReviews=d.reviews;}).catch(e=>console.log(e)),
                fetch('http://localhost:5000/api/promo/all', { headers: { 'Authorization': `Bearer ${token}` } }).then(r=>r.json()).then(d=>{if(d.success)allPromoCodes=d.promoCodes;}).catch(e=>console.log(e)),
                fetch('http://localhost:5000/api/loyalty/leaderboard').then(r=>r.json()).then(d=>{if(d.success)allLoyalty=d.leaderboard;}).catch(e=>console.log(e)),
                fetch('http://localhost:5000/api/driver/online').then(r=>r.json()).then(d=>{if(d.success)onlineDrivers=d.drivers||[];}).catch(e=>console.log(e))
            ]);
        }

        function renderDashboard() {
            let html = `
                <div class="stats-grid">
                    <div class="stat-card"><div>💰</div><div><div class="stat-value">$${stats.payments?.totalRevenue || 0}</div><div>Total Revenue</div></div></div>
                    <div class="stat-card"><div>👥</div><div><div class="stat-value">${stats.users?.total || 0}</div><div>Total Users</div></div></div>
                    <div class="stat-card"><div>👤</div><div><div class="stat-value">${stats.users?.customers || 0}</div><div>Customers</div></div></div>
                    <div class="stat-card"><div>🔧</div><div><div class="stat-value">${stats.users?.providers || 0}</div><div>Providers</div></div></div>
                    <div class="stat-card"><div>🚗</div><div><div class="stat-value">${stats.users?.drivers || 0}</div><div>Drivers</div></div></div>
                    <div class="stat-card"><div>📅</div><div><div class="stat-value">${stats.bookings?.total || 0}</div><div>Bookings</div></div></div>
                </div>
                <div class="card"><div class="card-title">🟢 Online Drivers (${onlineDrivers.length})</div><div class="driver-list">${onlineDrivers.map(d=>`<div class="driver-item"><span class="online-dot"></span> ${d.name || d.firstName || 'Driver'}</div>`).join('')||'No drivers online'}</div></div>
                <div class="card"><div class="card-title">📋 Recent Users</div><div class="table-wrapper"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th></tr></thead><tbody>${allUsers.slice(0,5).map(u=>`<tr><td>${u.firstName||''} ${u.lastName||''}</td><td>${u.email}</td><td>${u.role}</td></tr>`).join('')}</tbody></table></div></div>
                <div class="card"><div class="card-title">📅 Recent Bookings</div><div class="table-wrapper"><table><thead><tr><th>Service</th><th>Customer</th><th>Status</th><th>Amount</th></tr></thead><tbody>${allBookings.slice(0,5).map(b=>`<tr><td>${b.serviceName||'-'}</td><td>${b.customerId?.firstName||'-'}</td><td>${b.status}</td><td>$${b.totalAmount||0}</td></tr>`).join('')}</tbody></table></div></div>
            `;
            document.getElementById('content').innerHTML = html;
        }

        function renderUsers() {
            let filtered = allUsers.filter(u=>(filterRole==='all'||u.role===filterRole)&&(!searchTerm||u.email.includes(searchTerm.toLowerCase())||(u.firstName||'').toLowerCase().includes(searchTerm.toLowerCase())));
            let html = `<div class="card"><div class="filters"><select class="filter-select" id="roleFilter" onchange="filterRoleChange()"><option value="all">All</option><option value="customer">Customers</option><option value="provider">Providers</option><option value="driver">Drivers</option></select><input class="filter-input" id="searchInput" placeholder="Search..." onkeyup="filterSearch()"></div><div class="table-wrapper"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead><tbody>${filtered.map(u=>`<tr><td><strong>${u.firstName||''} ${u.lastName||''}</strong>${u.businessName?`<br><small>${u.businessName}</small>`:''}</td><td>${u.email}</td><td>${u.role}</td><td>${u.isActive?'Active':'Suspended'}</td><td><button class="btn-sm btn-danger" onclick="updateUserStatus('${u._id}',${!u.isActive})">${u.isActive?'Suspend':'Activate'}</button> ${(u.role==='provider'||u.role==='driver')&&!u.isVerified?`<button class="btn-sm btn-success" onclick="verifyUser('${u._id}','${u.role}')">Verify</button>`:''} <button class="btn-sm btn-purple" onclick="deleteUser('${u._id}','${u.firstName}')">Delete</button></td></tr>`).join('')}</tbody></table></div></div>`;
            document.getElementById('content').innerHTML = html;
            if(document.getElementById('roleFilter')) document.getElementById('roleFilter').value = filterRole;
            if(document.getElementById('searchInput')) document.getElementById('searchInput').value = searchTerm;
        }

        function renderProviders() {
            let providers = allUsers.filter(u=>u.role==='provider');
            let html = `<div class="card"><div class="table-wrapper"><table><thead><tr><th>Business</th><th>Owner</th><th>Email</th><th>Verified</th><th>Actions</th></tr></thead><tbody>${providers.map(p=>`<tr><td><strong>${p.businessName||p.firstName}</strong></td><td>${p.firstName||''} ${p.lastName||''}</td><td>${p.email}</td><td>${p.isVerified?'Verified':'Pending'}</td><td>${!p.isVerified?`<button class="btn-sm btn-success" onclick="verifyUser('${p._id}','Provider')">Verify</button>`:''} <button class="btn-sm btn-danger" onclick="updateUserStatus('${p._id}',false)">Suspend</button> <button class="btn-sm btn-purple" onclick="deleteUser('${p._id}','${p.businessName||p.firstName}')">Delete</button></td></tr>`).join('')}</tbody></table></div></div>`;
            document.getElementById('content').innerHTML = html;
        }

        function renderDrivers() {
            let drivers = allUsers.filter(u=>u.role==='driver');
            let html = `<div class="card"><div class="table-wrapper"><table><thead><tr><th>Name</th><th>Email</th><th>Vehicle</th><th>Verified</th><th>Actions</th></tr></thead><tbody>${drivers.map(d=>`<tr><td>${d.firstName||''} ${d.lastName||''}</td><td>${d.email}</td><td>${d.vehicleModel||'N/A'}</td><td>${d.isVerified?'Verified':'Pending'}</td><td>${!d.isVerified?`<button class="btn-sm btn-success" onclick="verifyUser('${d._id}','Driver')">Verify</button>`:''} <button class="btn-sm btn-danger" onclick="updateUserStatus('${d._id}',false)">Suspend</button> <button class="btn-sm btn-purple" onclick="deleteUser('${d._id}','${d.firstName}')">Delete</button></td></tr>`).join('')}</tbody></table></div></div>`;
            document.getElementById('content').innerHTML = html;
        }

        function renderBookings() {
            let filtered = allBookings.filter(b=>filterStatus==='all'||b.status===filterStatus);
            let html = `<div class="card"><select class="filter-select" id="statusFilter" onchange="filterStatusChange()" style="margin-bottom:15px;"><option value="all">All</option><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select><div class="table-wrapper"><table><thead><tr><th>Service</th><th>Customer</th><th>Provider</th><th>Date</th><th>Amount</th><th>Status</th></tr></thead><tbody>${filtered.map(b=>`<tr><td>${b.serviceName||'-'}</td><td>${b.customerId?.firstName||'-'}</td><td>${b.providerId?.businessName||'-'}</td><td>${new Date(b.bookingDate).toLocaleDateString()}</td><td>$${b.totalAmount||0}</td><td>${b.status}</td></tr>`).join('')}</tbody></table></div></div>`;
            document.getElementById('content').innerHTML = html;
            if(document.getElementById('statusFilter')) document.getElementById('statusFilter').value = filterStatus;
        }

        function renderServices() {
            let html = `<div class="card"><div class="table-wrapper"><table><thead><tr><th>Name</th><th>Provider</th><th>Price</th><th>Status</th><th>Actions</th></tr></thead><tbody>${allServices.map(s=>`<tr><td>${s.name}</td><td>${s.providerId?.businessName||s.providerId?.firstName}</td><td>$${s.price}</td><td>${s.isActive?'Active':'Hidden'}</td><td><button class="btn-sm ${s.isActive?'btn-danger':'btn-success'}" onclick="toggleService('${s._id}',${s.isActive})">${s.isActive?'Hide':'Show'}</button></td></tr>`).join('')}</tbody></table></div></div>`;
            document.getElementById('content').innerHTML = html;
        }

        function renderRevenue() {
            let html = `<div class="stats-grid"><div class="stat-card"><div class="stat-value">$${stats.payments?.totalRevenue||0}</div><div>Total Revenue</div></div><div class="stat-card"><div class="stat-value">$${(stats.payments?.totalRevenue||0)*0.15}</div><div>Platform Fee</div></div><div class="stat-card"><div class="stat-value">$${(stats.payments?.totalRevenue||0)*0.7}</div><div>Provider Payouts</div></div><div class="stat-card"><div class="stat-value">$${(stats.payments?.totalRevenue||0)*0.15}</div><div>Driver Payouts</div></div></div><div class="card"><div class="card-title">Revenue Summary</div><div style="text-align:center;padding:40px;"><div style="font-size:48px;">💰</div><div style="font-size:24px;font-weight:bold;">$${stats.payments?.totalRevenue||0}</div><div>Total Platform Revenue</div></div></div>`;
            document.getElementById('content').innerHTML = html;
        }

        function renderPayouts() { document.getElementById('content').innerHTML = '<div class="card"><div class="card-title">Payouts</div><div class="empty-state">No pending payouts</div></div>'; }
        function renderRefunds() { document.getElementById('content').innerHTML = '<div class="card"><div class="card-title">Refunds</div><div class="empty-state">No refund requests</div></div>'; }
        function renderReviews() { document.getElementById('content').innerHTML = '<div class="card"><div class="card-title">Reviews</div><div class="empty-state">No reviews yet</div></div>'; }
        function renderPromos() { document.getElementById('content').innerHTML = '<div class="card"><div class="card-title">Promo Codes</div><div class="empty-state">No promo codes</div></div>'; }
        function renderLoyalty() { document.getElementById('content').innerHTML = '<div class="card"><div class="card-title">Loyalty</div><div class="empty-state">No loyalty data</div></div>'; }

        async function updateUserStatus(userId, activate) { try { await fetch(`http://localhost:5000/api/admin/users/${userId}`,{method:'PUT',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},body:JSON.stringify({isActive:activate})}); alert(`User ${activate?'activated':'suspended'}`); await fetchAll(); loadTab(currentTab); } catch(e){alert('Error');} }
        async function verifyUser(userId, role) { try { await fetch(`http://localhost:5000/api/admin/users/${userId}`,{method:'PUT',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},body:JSON.stringify({isVerified:true})}); alert(`${role} verified!`); await fetchAll(); loadTab(currentTab); } catch(e){alert('Error');} }
        async function deleteUser(userId, name) { if(confirm(`Delete ${name}?`)) { try { await fetch(`http://localhost:5000/api/admin/users/${userId}`,{method:'DELETE',headers:{'Authorization':`Bearer ${token}`}}); alert('User deleted'); await fetchAll(); loadTab(currentTab); } catch(e){alert('Error');} } }
        async function toggleService(serviceId, isActive) { try { await fetch(`http://localhost:5000/api/admin/services/${serviceId}/status`,{method:'PATCH',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},body:JSON.stringify({isActive:!isActive})}); alert(`Service ${!isActive?'activated':'hidden'}`); await fetchAll(); loadTab(currentTab); } catch(e){alert('Error');} }

        function filterRoleChange() { filterRole = document.getElementById('roleFilter').value; renderUsers(); }
        function filterSearch() { searchTerm = document.getElementById('searchInput').value; renderUsers(); }
        function filterStatusChange() { filterStatus = document.getElementById('statusFilter').value; renderBookings(); }

        async function loadTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.menu-item').forEach(el=>el.classList.remove('active'));
            document.querySelector(`.menu-item[data-tab="${tab}"]`).classList.add('active');
            document.getElementById('pageTitle').innerText = tab.charAt(0).toUpperCase() + tab.slice(1);
            await fetchAll();
            if(tab==='dashboard') renderDashboard();
            else if(tab==='users') renderUsers();
            else if(tab==='providers') renderProviders();
            else if(tab==='drivers') renderDrivers();
            else if(tab==='bookings') renderBookings();
            else if(tab==='services') renderServices();
            else if(tab==='revenue') renderRevenue();
            else if(tab==='payouts') renderPayouts();
            else if(tab==='refunds') renderRefunds();
            else if(tab==='reviews') renderReviews();
            else if(tab==='promos') renderPromos();
            else if(tab==='loyalty') renderLoyalty();
        }

        function logout() { localStorage.removeItem('adminToken'); localStorage.removeItem('adminUser'); window.location.href = '/admin-login.html'; }

        document.querySelectorAll('.menu-item').forEach(el=>el.addEventListener('click',()=>loadTab(el.dataset.tab)));
        loadTab('dashboard');
    </script>
</body>
</html>
